name: gTile
options:
  bundleIdPrefix: com.gtile
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.38"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  gTile:
    type: application
    platform: macOS
    sources:
      - gTile
    settings:
      base:
        INFOPLIST_FILE: gTile/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: gTile/Resources/gTile.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.gtile.app
        PRODUCT_NAME: gTile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: KeyboardShortcuts

  gTileTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - gTileTests
    dependencies:
      - target: gTile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gtile.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/gTile.app/Contents/MacOS/gTile"
        BUNDLE_LOADER: "$(TEST_HOST)"
